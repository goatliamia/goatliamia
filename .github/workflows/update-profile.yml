name: Update 1-bit Pixel Profile

on:
  schedule:
    # Run every 4 hours so day/night and activity states stay fresh
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'profile.config.json'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate 1-bit pixel SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate.mjs

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-dark.svg assets/hero-light.svg assets/skyline-dark.svg assets/skyline-light.svg assets/preview-builder.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 1-bit pixel profile"
            git push
          fi
